<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samantha</title>
    <link rel="stylesheet" href="samantha.css">
</head>
<body>
    <audio id="musica" src="assets/bruja.mp3" loop preload="auto"></audio>

  <script>
    function activarMusica() {
      musica.play();
      document.removeEventListener('mousemove', activarMusica);
      document.removeEventListener('click', activarMusica);
      document.removeEventListener('keydown', activarMusica);
    }

    document.addEventListener('mousemove', activarMusica);
    document.addEventListener('click', activarMusica);
    document.addEventListener('keydown', activarMusica);

    </script>
</body>
</html>
